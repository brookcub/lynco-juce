name: timestamps-linux

# Builds UnitTestRunner with ALSA and JACK, runs the timestamp suites, then opens a JACK dummy
# server and (if snd-aloop loads) ALSA loopback devices through AudioDeviceManager and checks the
# device-timestamp roles. Triggered by pushes to this branch only.
on:
  push:
    branches: [ci/timestamps-combined, ci/timestamps-rails]

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04, ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libasound2-dev libjack-jackd2-dev jackd2 alsa-utils \
            xvfb libgl1-mesa-dev libfreetype-dev libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libcurl4-openssl-dev

      - name: Build UnitTestRunner
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXTRAS=ON -DCMAKE_CXX_FLAGS="-DJUCE_JACK=1 -DJUCE_ALSA=1"
          cmake --build build --target UnitTestRunner 2>&1 | tee build.log
          grep -E "warning:" build.log | grep -E "juce_ALSA_linux|juce_JackAudio|juce_CallbackTimeHelpers" || true

      # Combined tree: the runner's exit code gates, and these suites must also be present:
      # (every lane's seams are implemented).
      - name: Run the Audio tests
        run: |
          app=build/extras/UnitTestRunner/UnitTestRunner_artefacts/Release/UnitTestRunner
          xvfb-run -a "$app" --category=Audio > utr.log 2>&1 || { tail -40 utr.log; exit 1; }
          head -5 utr.log
          grep -c "^Completed tests in" utr.log || true
          for s in "ALSA device timestamps" "JACK processing cycle timestamps" "Callback timestamp alignment" "AudioDeviceManager"; do
            echo "$s: $(grep -c "^Completed tests in $s" utr.log || true) cases completed"
          done
          sed -n '/Test failure summary/,$p' utr.log
          if sed -n '/Test failure summary/,$p' utr.log | grep -E "^(ALSA|JACK|Callback timestamp|AudioDeviceManager)"; then exit 1; fi
          test "$(grep -c '^Completed tests in ALSA device timestamps' utr.log)" -eq 5
          test "$(grep -c '^Completed tests in JACK processing cycle timestamps' utr.log)" -eq 7

      - name: Build the integration harness
        run: |
          cmake -S .github/ci/ts-harness -B hbuild -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_SRC="$PWD"
          cmake --build hbuild

      # SPEC "JACK clock: ruling 8 replaced": present iff jack_get_time() is within 1 ms of
      # CLOCK_MONOTONIC or CLOCK_MONOTONIC_RAW, converted to CLOCK_MONOTONIC per callback. jackd2
      # stamps cycles with CLOCK_MONOTONIC_RAW, so this run must take the present path, and the
      # cycle time must land on CLOCK_MONOTONIC (the harness prints MONOTONIC - RAW).
      - name: JACK dummy server
        run: |
          export JACK_NO_AUDIO_RESERVATION=1
          jackd -d dummy -r 48000 -p 256 > jackd.log 2>&1 &
          JP=$!
          sleep 3
          xvfb-run -a ./hbuild/ts-harness_artefacts/Release/ts-harness list || true
          xvfb-run -a ./hbuild/ts-harness_artefacts/Release/ts-harness jack 20 require-present
          kill $JP

      # Runs on every runner (no sound card needed): null-plugin PCMs must have no stream roles
      - name: ALSA null plugin
        run: |
          mkdir -p nullhome
          cat > nullhome/.asoundrc <<'EOF'
          pcm.tsnull_out { type null  hint { show on  description "TS null out" } }
          pcm.tsnull_in  { type null  hint { show on  description "TS null in" } }
          EOF
          HOME=$PWD/nullhome xvfb-run -a ./hbuild/ts-harness_artefacts/Release/ts-harness alsa "TS null out" "TS null in" 5 absent

      - name: ALSA loopback (snd-aloop)
        run: |
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || echo "no linux-modules-extra for this kernel"
          if ! sudo modprobe snd-aloop pcm_substreams=2; then
            echo "SND-ALOOP-UNAVAILABLE: modprobe snd-aloop failed on this runner; ALSA integration not run"
            uname -r; exit 0
          fi
          cat /proc/asound/cards
          cat > ~/.asoundrc <<'EOF'
          pcm.tsloop_out { type hw  card Loopback  device 0  subdevice 0  hint { show on  description "TS loop out" } }
          pcm.tsloop_in  { type hw  card Loopback  device 1  subdevice 0  hint { show on  description "TS loop in" } }
          pcm.tsplug_out { type plug  slave.pcm "hw:Loopback,0,1"  hint { show on  description "TS plug out" } }
          pcm.tsplug_in  { type plug  slave.pcm "hw:Loopback,1,1"  hint { show on  description "TS plug in" } }
          EOF
          H="xvfb-run -a ./hbuild/ts-harness_artefacts/Release/ts-harness"
          $H list
          $H alsa "TS loop out" "TS loop in" 20 present /proc/asound/Loopback/pcm0p/sub0/hw_params /proc/asound/Loopback/pcm1c/sub0/hw_params
          $H alsa "TS plug out" "TS plug in" 10 absent
